 i:["Der Kuchlbauer Turm ist ein Architekturprojekt von Friedensreich Hundertwasser. Er entwarf ihn 1999 mit 70 Metern, so ließ er sich nicht bauen. Sein langjähriger Freund und Kollege Peter Pelikan passte den Entwurf an, gebaut wurde 2007 bis 2010. Im KunstHausAbensberg gibt es Einblicke in Leben und Werk Hundertwassers.",

    "La Torre Kuchlbauer è un progetto architettonico di Friedensreich Hundertwasser. Nel 1999 la disegnò alta 70 metri, ma così non si poteva costruire. Il suo amico e collega di lunga data Peter Pelikan adattò il progetto; la costruzione durò dal 2007 al 2010. Il KunstHausAbensberg offre uno sguardo sulla vita e l'opera di Hundertwasser.",
    "Da Kuchlbauer Turm is a Architekturprojekt vom Friedensreich Hundertwasser. Er hod'n 1999 mit 70 Meter entworfn, so hod mas need baun kinna. Sei langjähriger Freind und Kollege Peter Pelikan hod'n Entwurf angpasst, baut worn is 2007 bis 2010. Im KunstHausAbensberg gibt's Einblicke in Lebn und Werk vom Hundertwasser."],
 q:[

   ["Wer hod'n Kuchlbauer Turm 1999 entworfn?","Friedensreich Hundertwasser","Antoni Gaudí","Da Braumoasta af am Bierdeckl","Da Turm is laut Website a Architekturprojekt vom Friedensreich Hundertwasser."]],
  [["Wer passte den Entwurf an, sodass der Turm gebaut werden konnte?","Peter Pelikan, Freund und Kollege Hundertwassers","Niemand, er steht seit dem Mittelalter dort","Flaschl persönlich","Peter Pelikan plante, überarbeitete und baute den Turm in der heutigen Form. Flaschl hat nur zugeschaut."],
   ["Who adapted the design so the tower could be built?","Peter Pelikan, Hundertwasser's friend and colleague","Nobody, it has stood there since the Middle Ages","Flaschl in person","Peter Pelikan planned, revised and built the tower as it stands today. Flaschl just watched."],
   ["Chi adattò il progetto in modo da poter costruire la torre?","Peter Pelikan, amico e collega di Hundertwasser","Nessuno, è lì dal Medioevo","Flaschl in persona","Peter Pelikan ha pianificato, rielaborato e costruito la torre com'è oggi. Flaschl ha solo guardato."],

  [["Wie hoch war Hundertwassers ursprünglicher Entwurf von 1999?","70 Meter","7 Meter","700 Meter","Der Entwurf hatte 70 Meter und ließ sich so nicht bauen. Der Braukurs-Seite zufolge ist der gebaute Turm 35 Meter hoch."],

{id:"fuehr", ic:"ticket-perforated", url:SITE + "tickets-2/",
 t:["Führungen und Tickets","Tours and tickets","Visite guidate e biglietti","Führungen und Tickets"],
 i:["Zur Brauerei gehört „Kuchlbauers Bierwelt“ mit Brauereiführung und Turm. Geführt wird zu festen Zeiten, an welchen Tagen, hängt vom Zeitraum ab; zusätzlich gibt es Führungen nach Bedarf. Karfreitag und Allerheiligen ist geschlossen, Winterpause ist vom 24.12. bis 06.01. Hunde dürfen aus hygienischen Gründen nicht mit. Preise und Tickets: bitte auf der offiziellen Seite nachsehen.",
    "The brewery offers “Kuchlbauers Bierwelt” with a brewery tour and the tower. Tours run at fixed times; which days depends on the period; extra tours are available on demand. Closed on Good Friday and All Saints' Day, winter break from 24 Dec to 6 Jan. Dogs are not allowed for hygiene reasons. Prices and tickets: please check the official site.",
    "Alla birreria appartiene «Kuchlbauers Bierwelt» con visita alla birreria e alla torre. Si visita a orari fissi; i giorni dipendono dal periodo; in più ci sono visite su richiesta. Chiuso il Venerdì Santo e a Ognissanti, pausa invernale dal 24.12 al 06.01. I cani non sono ammessi per motivi igienici. Prezzi e biglietti: vedi il sito ufficiale.",
    "Zur Brauerei ghert „Kuchlbauers Bierwelt“ mit Brauereiführung und Turm. Gführt werd zu festn Zeitn, an wia vui Tag, hängt vom Zeitraum o; zusätzlich gibt's Führungen nach Bedarf. Karfreitag und Allerheiligen is zua, Winterpausn is vom 24.12. bis 06.01. Hund derfa aus hygienische Gründ need mit. Preise und Tickets: bitte af da offiziellen Seitn nachschaun."],

   ["At which fixed times do the tours run, according to the visitor information?","11:00, 13:00 and 15:00","7:00, 9:00 and 12:00","Only after the third wheat beer","The visitor information names 11, 13 and 15 o'clock. The days vary by period, so check the page beforehand."],
   ["A quali orari fissi si svolgono le visite secondo le info per i visitatori?","11:00, 13:00 e 15:00","7:00, 9:00 e 12:00","Solo dopo la terza birra","Le info indicano le 11, le 13 e le 15. I giorni variano secondo il periodo: meglio controllare prima sulla pagina."],
   ["Zu wöche festn Uhrzeitn find'n d'Führungen laut Besucherinfo statt?","11:00, 13:00 und 15:00 Uhr","7:00, 9:00 und 12:00 Uhr","Bloß nach da dritten Weissbier","D'Besucherinfo nennt 11, 13 und 15 Uhr. D'Tag variiern je nach Zeitraum, drum vorher af da Seitn nachschaun."]],
  [["An welchen Tagen ist laut Besucherinfo geschlossen?","Karfreitag und Allerheiligen","Rosenmontag und Aschermittwoch","Nie, Brauereien schlafen nicht","Karfreitag und Allerheiligen sind genannt. Dazu kommt die Winterpause vom 24.12. bis einschließlich 06.01."],

   ["An wöchane Tag is laut Besucherinfo zua?","Karfreitag und Allerheiligen","Rosnmontag und Aschermittwoch","Nia, Brauereien schlafa need","Karfreitag und Allerheiligen san gnennt. Dazua kimmt de Winterpausn vom 24.12. bis eischließlich 06.01."]],

{id:"brau", ic:"cup-straw", url:SITE + "braukurs/",
 t:["Der Braukurs","The brewing course","Il corso di produzione","Da Braukurs"],
 i:["Im Braukurs brauen Teilnehmende unter Anleitung von Braumeister Uwe selbst ein Weissbier, in der 3-hl-Mikrobrauerei, vom Schroten bis zur Lagerung. Dazu gehören eine Brauereiführung mit Turm und eine Verkostung verschiedener Weissbiere. Der Kurs dauert etwa acht Stunden. Preis, Termine und Buchung stehen auf der Braukurs-Seite; Anfragen laufen laut Seite ausschließlich schriftlich per E-Mail.",
    "In the brewing course participants brew a wheat beer themselves under the guidance of master brewer Uwe, in the 3 hl microbrewery, from milling to storage. It includes a brewery tour with the tower and a tasting of different wheat beers. The course takes about eight hours. Price, dates and booking are on the course page; according to the page, enquiries are made exclusively in writing by email.",
    "Nel corso i partecipanti producono da soli una birra di frumento, guidati dal mastro birraio Uwe, nel microbirrificio da 3 hl, dalla macinatura allo stoccaggio. Include una visita alla birreria con la torre e una degustazione di diverse birre di frumento. Il corso dura circa otto ore. Prezzo, date e prenotazione sono sulla pagina del corso; secondo la pagina le richieste vanno fatte solo per iscritto via e-mail.",
    "Im Braukurs braun d'Teilnehmer unter Anleitung vom Braumoasta Uwe söiba a Weissbier, in da 3-hl-Mikrobrauerei, vom Schroten bis zur Lagerung. Dazua ghert a Brauereiführung mit Turm und a Verkostung vo verschiedene Weissbier. Da Kurs dauert ungfähr acht Stund. Preis, Termine und Buchung stengan af da Braukurs-Seitn; Anfragn laffa laut Seitn ausschließlich schriftlich per E-Mail."],

   ["How big is the microbrewery where the brewing happens?","3 hectolitres","300 hectolitres","3 litres","According to the course page the brewing takes place in the 3 hl microbrewery, a manageable amount of wheat beer."],
   ["Quanto è grande il microbirrificio in cui si produce?","3 ettolitri","300 ettolitri","3 litri","Secondo la pagina del corso si produce nel microbirrificio da 3 hl, una quantità gestibile di birra di frumento."],
   ["Wia groß is d'Mikrobrauerei, wo braut werd?","3 Hektoliter","300 Hektoliter","3 Liter","Laut Braukurs-Seitn werd in da 3-hl-Mikrobrauerei braut, oiso a Weissbier in überschaubare Menge."]],
  [["Wie lange dauert der Braukurs ungefähr?","Etwa acht Stunden","Etwa 45 Minuten","Etwa drei Tage","Die Seite nennt ca. 8 Stunden mit Treffpunkt morgens vor dem Hauptgebäude. Für einen ganzen Brauprozess ist das erstaunlich kurz."],

  [["Ab wie vielen Teilnehmenden findet der Kurs laut Seite statt?","Ab 7 Teilnehmenden","Ab 2 Teilnehmenden","Ab 70 Teilnehmenden","Wird die Mindestzahl nicht erreicht, werden die Teilnehmenden rechtzeitig informiert. Anfragen gehen laut Seite nur schriftlich per E-Mail."],
   ["From how many participants does the course take place, according to the page?","From 7 participants","From 2 participants","From 70 participants","If the minimum is not reached, participants are informed in good time. Enquiries are made in writing by email only, says the page."],
   ["Da quanti partecipanti si svolge il corso secondo la pagina?","Da 7 partecipanti","Da 2 partecipanti","Da 70 partecipanti","Se il minimo non è raggiunto, i partecipanti vengono avvisati in tempo. Le richieste vanno fatte solo per iscritto via e-mail."],

{id:"events", ic:"balloon-heart", url:SITE + "veranstaltungen-genuss/",
 t:["Veranstaltungen und Genuss","Events and enjoyment","Eventi e gusto","Veranstaltungen und Genuss"],
 i:["Auf dem Gelände ist immer etwas los: Kuchlbauers Ostermarkt für die ganze Familie, Kuchlbauers Turmweihnacht, der Gillamoos (laut Seite einer der ältesten Jahrmärkte der Region, Tradition seit 1313), der Biergarten am Fuß des Turms neben dem Erdhügelhaus und der Brauereigasthof, das Mutterhaus des Weissbier-Spezialisten. Termine stehen auf der offiziellen Seite.",
    "There is always something going on at the site: Kuchlbauer's Easter market for the whole family, Kuchlbauer's Turmweihnacht (Christmas at the tower), the Gillamoos (one of the region's oldest fairs according to the page, a tradition since 1313), the beer garden at the foot of the tower next to the earth mound house, and the Brauereigasthof, the mother house of the wheat beer specialist. Dates are on the official site.",
    "Nel complesso c'è sempre qualcosa da fare: il mercatino di Pasqua di Kuchlbauer per tutta la famiglia, la Turmweihnacht (Natale alla torre), il Gillamoos (secondo la pagina una delle fiere più antiche della regione, tradizione dal 1313), il giardino della birra ai piedi della torre accanto alla casa-collina e il Brauereigasthof, la casa madre dello specialista della birra di frumento. Le date sono sul sito ufficiale.",
    "Af'm Gelände is imma wos los: Kuchlbauers Ostermarkt fia d'ganze Familie, Kuchlbauers Turmweihnacht, da Gillamoos (laut Seitn oana vo de ältestn Jahrmärkt vo da Region, Tradition seit 1313), da Biergarten am Fuaß vom Turm nebn'm Erdhügelhaus und da Brauereigasthof, as Muattahaus vom Weissbier-Spezialistn. Termine stengan af da offiziellen Seitn."],
 q:[
  [["Seit wann hat der Gillamoos laut Seite Tradition?","Seit 1313","Seit 1913","Seit letztem Dienstag","Laut Kuchlbauer-Seite ist der Gillamoos einer der ältesten Jahrmärkte der Region, mit Tradition seit 1313."],
   ["Since when does the Gillamoos have a tradition, according to the page?","Since 1313","Since 1913","Since last Tuesday","According to the Kuchlbauer page the Gillamoos is one of the region's oldest fairs, a tradition since 1313."],
   ["Da quando il Gillamoos ha una tradizione secondo la pagina?","Dal 1313","Dal 1913","Da martedì scorso","Secondo la pagina di Kuchlbauer il Gillamoos è una delle fiere più antiche della regione, tradizione dal 1313."],
   ["Seit wann hod da Gillamoos laut Seitn Tradition?","Seit 1313","Seit 1913","Seit letztn Dienstag","Laut Kuchlbauer-Seitn is da Gillamoos oana vo de ältestn Jahrmärkt vo da Region, mit Tradition seit 1313."]],
  [["Wo liegt der Biergarten laut Seite?","Am Fuß des Kuchlbauer Turms, neben dem Erdhügelhaus","Auf dem Dach des Turms","Mitten im Hopfenfeld der Hallertau","Der Biergarten liegt am Fuß des Kuchlbauer Turms, neben dem Erdhügelhaus."],

   ["Wo liegt da Biergarten laut Seitn?","Am Fuaß vom Kuchlbauer Turm, nebn'm Erdhügelhaus","Af'm Dach vom Turm","Mittn im Hopfnfeid vo da Hallertau","Da Biergarten liegt am Fuaß vom Kuchlbauer Turm, nebn'm Erdhügelhaus."]],
  [["Was ist der Brauereigasthof zum Kuchlbauer laut Startseite?","Das Mutterhaus des Weissbier-Spezialisten","Ein Pop-up-Store im Turm","Eine Raststätte an der Autobahn","Der Brauereigasthof ist laut Startseite das Mutterhaus des Weissbier-Spezialisten."],
   ["What is the Brauereigasthof zum Kuchlbauer according to the start page?","The mother house of the wheat beer specialist","A pop-up store in the tower","A motorway service area","According to the start page the Brauereigasthof is the mother house of the wheat beer specialist."],
   ["Cos'è il Brauereigasthof zum Kuchlbauer secondo la pagina iniziale?","La casa madre dello specialista della birra di frumento","Un pop-up store nella torre","Un autogrill","Secondo la pagina iniziale il Brauereigasthof è la casa madre dello specialista della birra di frumento."],
   ["Wos is da Brauereigasthof zum Kuchlbauer laut Startseitn?","As Muattahaus vom Weissbier-Spezialistn","A Pop-up-Store im Turm","A Raststätt an da Autobahn","Da Brauereigasthof is laut Startseitn as Muattahaus vom Weissbier-Spezialistn."]]

{id:"besuch", ic:"geo-alt", url:SITE + "besucherinfo/",
 t:["Besucherinfo","Visitor information","Info per i visitatori","Besucherinfo"],
 i:["Die Brauerei liegt in der Römerstraße 5 bis 9 in Abensberg. Geparkt wird am Brauereigelände (Schulhausplatz 4, bei Märkten gesperrt) oder auf der Gillamooswiese, von dort sind es laut Seite 5 bis 10 Minuten zu Fuß. Vom Bahnhof Abensberg sind es etwa 5 Minuten zu Fuß. Im Turm fährt ein Aufzug bis zur Aussichtsterrasse; Bierwelt und Turm sind aus baulichen Gründen nur bedingt für Rollstuhlfahrende zugänglich.",
    "The brewery is at Römerstraße 5 to 9 in Abensberg. Parking is at the brewery site (Schulhausplatz 4, closed during markets) or at the Gillamooswiese, from where it is a 5 to 10 minute walk according to the page. From Abensberg station it is about a 5 minute walk. A lift in the tower goes up to the viewing terrace; for structural reasons Bierwelt and tower are only partly accessible to wheelchair users.",
    "La birreria si trova in Römerstraße 5-9 ad Abensberg. Si parcheggia presso la birreria (Schulhausplatz 4, chiuso durante i mercati) o alla Gillamooswiese, da dove secondo la pagina sono 5-10 minuti a piedi. Dalla stazione di Abensberg sono circa 5 minuti a piedi. Un ascensore nella torre sale fino alla terrazza panoramica; per motivi strutturali Bierwelt e torre sono accessibili solo in parte alle persone in sedia a rotelle.",
    "D'Brauerei liegt in da Römerstraß 5 bis 9 in Abensberg. Parkt werd am Brauereigelände (Schulhausplatz 4, bei Märkt gsperrt) oda af da Gillamooswiesn, vo do san s' laut Seitn 5 bis 10 Minutn zu Fuaß. Vom Bahnhof Abensberg san s' ungfähr 5 Minutn zu Fuaß. Im Turm fährt a Aufzug bis zur Aussichtsterrassn; Bierwelt und Turm san aus bauliche Gründ bloß bedingt fia Rollstuihfahrer zuagängli."],
 q:[

   ["How far does the lift in the Kuchlbauer Tower go?","Up to the viewing terrace","Down to the fermentation cellar","Not at all, there are only stairs","A lift goes up to the viewing terrace in the tower. Bierwelt and tower are still only partly accessible to wheelchair users."],
   ["Fin dove sale l'ascensore nella Torre Kuchlbauer?","Fino alla terrazza panoramica","Fino alla cantina di fermentazione","Per niente, ci sono solo scale","Un ascensore sale fino alla terrazza panoramica della torre. Bierwelt e torre sono comunque solo in parte accessibili a chi è in sedia a rotelle."],

{id:"boss", ic:"tree", boss:true, url:SITE + "bier-und-kunst/",
 t:["Bossrunde: Weitblick","Boss round: foresight","Round finale: lungimiranza","Bossrunde: Weitblick"],
 i:["Letzte Runde! Laut Familienbrauerei-Seite vereinbarte die Brauerei 2018 mit fünf regionalen Landwirten, Gerste ausschließlich für Kuchlbauer anzubauen, und erzeugte 1.239.000 kWh Strom mit eigenen Solaranlagen; Überschuss ging ins Netz. Das Weissbier-Quartier+ beschreibt die Startseite als klimapositives Logistikzentrum und Lebensraum für Mensch und Natur.",

const certUrl = id => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(certSvg(id));
function certBlob(id){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = 1200; c.height = 850; c.getContext("2d").drawImage(img, 0, 0, 1200, 850); c.toBlob(b => b ? res(b) : rej(new Error("png")), "image/png"); }; img.onerror = rej; img.src = certUrl(id); });
}
function certTitle(id){ return id === "master" ? t("master") : t("cert") + ": " + lessonById(id).t[li()]; }
async function saveCert(id){
  try{ const b = await certBlob(id), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "kuchlbauer-urkunde-" + id + ".png"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  catch(e){ snack("Bild: " + (e.message || e)); }
}
async function shareCert(id){
  const text = id === "master" ? t("shMaster") : t("shLesson", {l:lessonById(id).t[li()], r:bestOf(id), n:NQ});
  let blob = null; try{ blob = await certBlob(id); }catch(e){ /* ohne Bild teilen */ }
  doShare(text, blob);
}
function shareLesson(L, r){ shareCert(L.id); }

function viewCert(){
  const id = view.id, master = id === "master";
  if(master && !allPassed()) return h("section", {class:"card"}, h("p", {text:t("masterLocked")}), h("button", {type:"button", class:"btn ghost", onclick:() => go({v:"certs"})}, ic("arrow-left"), t("certs")));
  if(master && !st.prog._masterDate){ st.prog._masterDate = new Date().toISOString().slice(0, 10); save(); }
  return h("section", {class:"card cert"}, h("h2", {text:certTitle(id)}),
    h("img", {src:certUrl(id), alt:certTitle(id) + " " + (st.name || "")}),
    h("div", {class:"opts noprint"},
      h("button", {type:"button", class:"btn big", onclick:() => shareCert(id)}, ic("share"), t("shareCert")),
      h("div", {class:"row"}, h("button", {type:"button", class:"btn ghost", onclick:() => saveCert(id)}, ic("download"), t("saveImg")),
        h("button", {type:"button", class:"btn ghost", onclick:() => window.print()}, ic("printer"), t("print")),

function viewCerts(){

    h("section", {class:"card", style:"margin-top:16px"}, h("h3", {}, ic("trophy"), " ", t("master")),
      allPassed() ? h("div", {class:"row"}, h("button", {type:"button", class:"btn", onclick:() => shareCert("master")}, ic("share"), t("share")), h("button", {type:"button", class:"btn ghost", onclick:() => go({v:"cert", id:"master"})}, ic("award"), t("cert"))) : h("p", {class:"mut", text:t("masterLocked")})),
    h("button", {type:"button", class:"btn ghost", onclick:() => go({v:"home"})}, ic("house"), t("overview")));
}

/* ---------- Teilen ---------- */
async function doShare(text, blob){
  try{
    if(navigator.share){
      if(blob && navigator.canShare){ const f = new File([blob], "kuchlbauer-urkunde.png", {type:"image/png"}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:t("title"), text:text + " " + SHARE_URL}); return; } }
      await navigator.share({title:t("title"), text, url:SHARE_URL}); return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const d = $("#shdlg"); const full = text + " " + SHARE_URL;
  d.replaceChildren(h("h3", {text:t("share")}), h("p", {class:"small mut", text:text}),
    ext("https://wa.me/?text=" + encodeURIComponent(full), "btn", ic("whatsapp"), t("shWa")),
    h("a", {class:"btn", href:"mailto:?subject=" + encodeURIComponent(t("title")) + "&body=" + encodeURIComponent(full)}, ic("envelope"), t("shMail")),
    h("button", {type:"button", class:"btn ghost", onclick:async () => { try{ await navigator.clipboard.writeText(full); snack(t("copied")); }catch(e){ snack(SHARE_URL); } }}, ic("clipboard"), t("shCopy")),
    h("button", {type:"button", class:"btn ghost", onclick:() => d.close()}, ic("x-lg"), t("shClose")));
  if(d.showModal) d.showModal(); else d.setAttribute("open", "");
}

function render(){
  document.documentElement.lang = LANGS[li()][4];
  document.title = t("title");
  $("#top").replaceChildren(header());
  const app = $("#app");
  app.replaceChildren(view.v === "home" ? viewHome() : view.v === "lesson" ? viewLesson() : view.v === "certs" ? viewCerts() : viewCert());
  $("#foot").replaceChildren(footer());
}
